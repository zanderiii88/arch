<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075976"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="A little island, at your own pace. Archipelago mobile prototype."><title>Archipelago</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<section id="menu" class="screen menu"><div class="menu-art"></div><div class="menu-shade"></div><header class="brand"><p class="eyebrow">A LITTLE ISLAND. YOUR OWN PACE.</p><h1>ARCHIPELAGO</h1><span class="wave-rule">~ ~ ~</span></header><div class="menu-actions"><button id="newGame" class="gold">New game</button><button id="continueGame">Continue</button><button id="menuSettings" class="quiet">Settings</button><small>Island prototype · v0.1.0</small></div></section>
<section id="creator" class="screen paper hidden"><button class="back" id="creatorBack" aria-label="Back to menu">‹</button><p class="eyebrow">YOUR ISLAND STORY</p><h2>Make yourself<br>at home.</h2><div class="portrait-wrap"><button id="prevStyle" class="arrow" aria-label="Previous hairstyle">‹</button><canvas id="portrait" width="160" height="150" aria-label="Your character preview"></canvas><button id="nextStyle" class="arrow" aria-label="Next hairstyle">›</button></div><div class="choices"><div class="choice"><span>Hair style</span><div id="styles" class="swatches"></div></div><div class="choice"><span>Hair colour</span><div id="hair" class="swatches"></div></div><div class="choice"><span>Skin tone</span><div id="skin" class="swatches"></div></div><div class="choice"><span>Outfit</span><div id="outfit" class="swatches"></div></div></div><label class="name-label" for="name">Your name</label><input id="name" maxlength="20" placeholder="What shall we call you?" autocomplete="off" value="Rowan"><button id="setSail" class="gold">Set sail <span aria-hidden="true">➜</span></button><p class="small-note">A place to make your own.</p></section>
<section id="game" class="screen hidden"><header class="game-head"><button id="pause" class="icon-button" aria-label="Open menu">☰</button><div><h2>Home Island</h2><span id="greeting">Take your time.</span></div><div class="coins"><span aria-hidden="true">●</span> 120</div></header><div id="worldWrap"><canvas id="world" width="512" height="768" aria-label="Island map. Tap the ground to walk, or tap a location to visit it."></canvas><div id="labels"></div><div id="arrival" class="hidden"><button id="interact" class="gold">Explore</button></div><div id="toast" role="status"></div></div><footer class="game-foot"><button id="bag">▣ <span>Bag</span></button><button id="help" class="icon-button" aria-label="How to play">?</button><button id="journal">▤ <span>Journal</span></button></footer></section>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card paper"><button id="closeModal" class="close" aria-label="Close">×</button><p id="modalKicker" class="eyebrow">ARCHIPELAGO</p><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<div id="loading"><span class="loading-buoy">◆</span><p>Finding your island…</p><small id="loadDetail">Packing a little sea air.</small></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
</main><script src="game.js"></script></body></html>
